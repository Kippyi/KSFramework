<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSFramework UI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(0,0,0,0.85) 0%, rgba(20,20,40,0.9) 100%); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .overlay.active { display: flex; }
        .char-select-container { background: rgba(15,15,30,0.95); border: 1px solid rgba(100,150,255,0.3); border-radius: 12px; padding: 40px; max-width: 900px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .char-select-title { color: #ffcc00; font-size: 28px; text-align: center; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 3px; }
        .char-list { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
        .char-card { background: rgba(30,30,60,0.8); border: 1px solid rgba(100,150,255,0.2); border-radius: 8px; padding: 20px; width: 250px; cursor: pointer; transition: all 0.3s ease; }
        .char-card:hover { border-color: rgba(100,150,255,0.6); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(100,150,255,0.2); }
        .char-card-name { color: #ffffff; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .char-card-info { color: rgba(255,255,255,0.7); font-size: 13px; line-height: 1.6; }
        .char-card-info span { color: #4cc9f0; }
        .char-card-cash { color: #06d6a0; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .btn { padding: 12px 30px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; }
        .btn-primary { background: linear-gradient(135deg, #4cc9f0, #3a86ff); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(76,201,240,0.4); }
        .btn-success { background: linear-gradient(135deg, #06d6a0, #00b894); color: white; }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(6,214,160,0.4); }
        .btn-danger { background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: white; }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,107,107,0.4); }
        .char-select-actions { display: flex; gap: 15px; justify-content: center; }
        .char-create-container { background: rgba(15,15,30,0.95); border: 1px solid rgba(100,150,255,0.3); border-radius: 12px; padding: 40px; max-width: 500px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .char-create-title { color: #ffcc00; font-size: 28px; text-align: center; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 3px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: rgba(255,255,255,0.8); font-size: 13px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; background: rgba(30,30,60,0.8); border: 1px solid rgba(100,150,255,0.2); border-radius: 6px; color: white; font-size: 14px; outline: none; transition: border-color 0.3s ease; }
        .form-group input:focus, .form-group select:focus { border-color: rgba(100,150,255,0.6); }
        .form-group select option { background: rgba(30,30,60,0.95); color: white; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        .char-create-actions { display: flex; gap: 15px; justify-content: center; margin-top: 25px; }
        .dashboard { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.75); color: white; padding: 18px 22px; border-radius: 8px; width: 280px; border: 1px solid rgba(100,150,255,0.15); display: none; z-index: 500; }
        .dashboard.active { display: block; }
        .dashboard-title { font-size: 16px; margin-bottom: 12px; color: #ffcc00; text-align: center; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        .info-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
        .info-label { opacity: 0.7; }
        .info-value { font-weight: bold; }
        .info-value.positive { color: #06d6a0; }
        .info-value.highlight { color: #4cc9f0; }
        .notification { position: fixed; top: 20px; right: 20px; background: rgba(15,15,30,0.95); border: 1px solid rgba(100,150,255,0.3); border-radius: 8px; padding: 15px 25px; color: white; font-size: 14px; z-index: 2000; transform: translateX(400px); transition: transform 0.4s ease; max-width: 350px; }
        .notification.show { transform: translateX(0); }
        .notification.success { border-left: 4px solid #06d6a0; }
        .notification.error { border-left: 4px solid #ff6b6b; }
        .notification.info { border-left: 4px solid #4cc9f0; }
    </style>
</head>
<body>
    <div id="charSelectOverlay" class="overlay">
        <div class="char-select-container">
            <div class="char-select-title">Select Character</div>
            <div id="charList" class="char-list"></div>
            <div class="char-select-actions">
                <button class="btn btn-primary" onclick="createNewCharacter()">Create New Character</button>
            </div>
        </div>
    </div>

    <div id="charCreateOverlay" class="overlay">
        <div class="char-create-container">
            <div class="char-create-title">Create Character</div>
            <form id="charCreateForm" onsubmit="return false;">
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="firstname" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="lastname" placeholder="Doe" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dateofbirth" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Gender</label>
                        <select id="gender" required>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nationality</label>
                        <input type="text" id="nationality" placeholder="American" value="American">
                    </div>
                </div>
                <div class="char-create-actions">
                    <button class="btn btn-success" onclick="submitCharacterCreation()">Create</button>
                    <button class="btn btn-danger" onclick="cancelCharacterCreation()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="dashboard" class="dashboard">
        <div class="dashboard-title">KSFramework</div>
        <div class="info-row">
            <span class="info-label">Name:</span>
            <span class="info-value" id="hudName">N/A</span>
        </div>
        <div class="info-row">
            <span class="info-label">Job:</span>
            <span class="info-value highlight" id="hudJob">Unemployed</span>
        </div>
        <div class="info-row">
            <span class="info-label">Level:</span>
            <span class="info-value" id="hudLevel">1</span>
        </div>
        <div class="info-row">
            <span class="info-label">Cash:</span>
            <span class="info-value positive" id="hudCash">$0</span>
        </div>
        <div class="info-row">
            <span class="info-label">Bank:</span>
            <span class="info-value positive" id="hudBank">$0</span>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script>
        function showCharacterSelection(characters) {
            var overlay = document.getElementById('charSelectOverlay');
            var charList = document.getElementById('charList');
            charList.innerHTML = '';

            characters.forEach(function(char) {
                var card = document.createElement('div');
                card.className = 'char-card';
                card.onclick = function() { selectCharacter(char.id); };

                card.innerHTML =
                    '<div class="char-card-name">' + escapeHtml(char.firstname) + ' ' + escapeHtml(char.lastname) + '</div>' +
                    '<div class="char-card-info">' +
                        '<div>Gender: <span>' + escapeHtml(char.gender) + '</span></div>' +
                        '<div>Job: <span>' + escapeHtml(char.job || 'unemployed') + '</span></div>' +
                        '<div>Level: <span>' + (char.level || 1) + '</span></div>' +
                    '</div>' +
                    '<div class="char-card-cash">$' + formatNumber(char.cash || 0) + ' cash</div>';

                charList.appendChild(card);
            });

            overlay.classList.add('active');
        }

        function selectCharacter(characterId) {
            document.getElementById('charSelectOverlay').classList.remove('active');
            fetch('https://' + GetParentResourceName() + '/selectCharacter', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ characterId: characterId })
            });
        }

        function createNewCharacter() {
            document.getElementById('charSelectOverlay').classList.remove('active');
            document.getElementById('charCreateOverlay').classList.add('active');
        }

        function cancelCharacterCreation() {
            document.getElementById('charCreateOverlay').classList.remove('active');
            document.getElementById('charSelectOverlay').classList.add('active');
        }

        function submitCharacterCreation() {
            var firstname = document.getElementById('firstname').value.trim();
            var lastname = document.getElementById('lastname').value.trim();
            var dateofbirth = document.getElementById('dateofbirth').value;
            var gender = document.getElementById('gender').value;
            var nationality = document.getElementById('nationality').value.trim() || 'American';

            if (!firstname || !lastname || !dateofbirth) {
                showNotification('Please fill in all required fields.', 'error');
                return;
            }

            document.getElementById('charCreateOverlay').classList.remove('active');

            fetch('https://' + GetParentResourceName() + '/createCharacter', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    firstname: firstname,
                    lastname: lastname,
                    dateofbirth: dateofbirth,
                    gender: gender,
                    nationality: nationality
                })
            });
        }

        function showCharacterCreation() {
            document.getElementById('charCreateOverlay').classList.add('active');
        }

        function updateHUD(data) {
            var dashboard = document.getElementById('dashboard');
            dashboard.classList.add('active');

            if (data.firstname && data.lastname) {
                document.getElementById('hudName').textContent = data.firstname + ' ' + data.lastname;
            }
            if (data.job !== undefined) {
                document.getElementById('hudJob').textContent = data.job.charAt(0).toUpperCase() + data.job.slice(1);
            }
            if (data.level !== undefined) {
                document.getElementById('hudLevel').textContent = data.level;
            }
            if (data.cash !== undefined) {
                document.getElementById('hudCash').textContent = '$' + formatNumber(data.cash);
            }
            if (data.bank !== undefined) {
                document.getElementById('hudBank').textContent = '$' + formatNumber(data.bank);
            }
        }

        function hideHUD() {
            document.getElementById('dashboard').classList.remove('active');
        }

        function showNotification(message, type) {
            type = type || 'info';
            var notif = document.getElementById('notification');
            notif.textContent = message;
            notif.className = 'notification ' + type + ' show';

            setTimeout(function() {
                notif.classList.remove('show');
            }, 3000);
        }

        function formatNumber(num) {
            return Number(num).toLocaleString();
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }

        window.addEventListener('message', function(event) {
            var data = event.data;

            switch (data.action) {
                case 'showCharacterSelection':
                    showCharacterSelection(data.characters);
                    break;
                case 'showCharacterCreation':
                    showCharacterCreation();
                    break;
                case 'updateCharacter':
                    updateHUD(data);
                    break;
                case 'updateCash':
                    document.getElementById('hudCash').textContent = '$' + formatNumber(data.cash);
                    break;
                case 'updateBank':
                    document.getElementById('hudBank').textContent = '$' + formatNumber(data.bank);
                    break;
                case 'jobUpdate':
                    document.getElementById('hudJob').textContent = data.job.charAt(0).toUpperCase() + data.job.slice(1);
                    break;
                case 'notification':
                    showNotification(data.message, data.type);
                    break;
            }
        });
    </script>
</body>
</html>
