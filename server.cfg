# KSFramework Server Configuration
# Add this to your main server.cfg or exec this file

# Database Configuration
set mysql_connection_string "username:password@tcp(localhost:3306)/ksframework"

# Core Library (must load first)
ensure kr-lib

# Framework Resources (load order matters)
ensure kr-core
ensure kr-inventory
ensure kr-characters

# Add your other resources below
# ensure your-other-resource
